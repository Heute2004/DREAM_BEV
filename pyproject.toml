[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-bev-information-fusion"
version = "0.1.0"
description = "Reproducible implementation of DREAM-BEV condition-routed radar-vision fusion."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.2",
    "Pillow==10.4.0",
    "PyYAML==6.0.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
development = ["pytest==8.3.3"]
mamba = ["mamba-ssm==2.2.6.post3"]
figures = ["matplotlib==3.11.0", "pandas==2.3.3", "PyMuPDF>=1.24"]
public = ["einops>=0.8,<1", "timm>=1,<2", "scipy>=1.11,<2", "scikit-learn>=1.4,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
